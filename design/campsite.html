<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; font-family: Inter, sans-serif; }
  .view { display: none; position: relative; }
  .view.on { display: block; }
  .cap { position: absolute; left: 28px; bottom: 22px; font: 600 15px Inter; color: #e9e2d6; text-shadow: 0 2px 8px #000; letter-spacing: .02em; }
  .cap b { font: 600 22px Oswald; letter-spacing: .06em; text-transform: uppercase; display: block; color: #fff; }
</style>
</head>
<body>
<div class="view" id="road"></div>
<div class="view" id="overview"></div>
<div class="view" id="fire"></div>
<div class="view" id="messhall"></div>
<div class="view" id="lake"></div>
<div class="view" id="tower"></div>
<div class="view" id="plan"></div>
<script src="r3d.js"></script>
<script src="campsite-scene.js"></script>
<script>
const views = {
  road() {
    const sc = Scene({ ...S1, ambient: [0.035, 0.04, 0.06], exposure: 1.4, fog: { c: [0.02, 0.025, 0.04], start: 18, end: 70, max: 0.85 }, sky: (cam) => SKY(cam) + stars(140) });
    camp(sc, { forestOpts: { n: 260 } });
    for (const [x, z, f] of [[23.5, 1.4, Math.PI], [21.8, 2.4, Math.PI + 0.3], [25.9, 1.2, Math.PI - 0.2], [24.6, 5.5, Math.PI], [26.5, 9, Math.PI + 0.2]]) robed(sc, x, 0, z, f, 0.25);
    // Fire glow over the palisade.
    glow(sc, V(24, 3, -14), FIRE, 9, 0.22);
    const cam = camera(V(28.5, 2.2, 22), V(23, 2.0, 0), 720, W, H, 1);
    return render(sc, cam, vignette(W, H, 0.8)) + caption('The main gate', 'The minibus is still running, headlights on the boards. Smoke from the fire rises over the palisade.');
  },

  overview() {
    const sc = Scene({ ...S1, ambient: [0.05, 0.055, 0.075], exposure: 1.35, fog: { c: [0.02, 0.025, 0.04], start: 60, end: 140, max: 0.8 }, sky: SKY });
    camp(sc, { power: true, forestOpts: { n: 220 } });
    for (const [x, z] of [[23.5, 6], [22, 4], [30.5, 2], [6, 2.5], [-2, -18], [51, -10], [55, -17.5], [30, -44], [42, -44], [-2, -30]]) robed(sc, x, x > 50 ? 0.3 : 0, z, 0, 0.2);
    player(sc, 23, 0, -11, 1, '#3a6ea5'); player(sc, 25.5, 0, -12, 1, '#a53a3a');
    const cam = camera(V(-6, 34, 26), V(27, 0, -21), 1000, W, 900, 1);
    const labels = [
      [19, 0.5, -9, 'A · Fire circle', 'start'], [24, 6.5, -37, 'B · Mess hall', '750'], [7, 11, -24, 'C · Chapel', '1000'],
      [41, 4.5, -18, 'D · Cabins', '1000'], [42, 10.5, -39, 'E · Compound', '1250'], [28, 5.5, 2, 'Main gate', '10 boards'], [62, 1.5, -24, 'Lake', 'zombies wade in'],
    ].map((l) => label(cam, ...l)).join('');
    return render(sc, cam, labels + vignette(W, 900, 0.6)) + caption('Camp Morrow, power on', 'Five zones in one clearing. Fences are low: you see, and shoot, across the whole camp.');
  },

  fire() {
    const sc = Scene({ ...S1, ambient: [0.03, 0.035, 0.05], exposure: 1.05, fog: { c: [0.02, 0.025, 0.04], start: 20, end: 60, max: 0.9 }, sky: (cam) => SKY(cam) + stars(90) });
    camp(sc, { forestOpts: { n: 200 } });
    for (const [x, z, f] of [[33.5, -10, -1.2], [32.6, -14, -1.4]]) robed(sc, x + 2.5, 0, z, f, 0.2); // beyond the east fence
    robed(sc, 22.2, 0, -30.5, 0.2, 0.2);
    const cam = camera(V(25.2, 1.6, -7.2), V(24.2, 0.6, -18), 700, W, H, 1);
    return render(sc, cam, gunModel() + prompt('Feed the fire', '1,000') + vignette(W, H, 0.82)) + caption('The fire circle (start)', 'Embers still hot, a guitar left on a log, the camcorder still recording. Tents in a ring, the mess hall behind.');
  },

  messhall() {
    const sc = Scene({ ...S1, ambient: [0.025, 0.025, 0.03], exposure: 1.25, fog: { c: [0.02, 0.018, 0.016], start: 10, end: 30, max: 0.6 } });
    // Interior: floor, inside faces of the walls, a ceiling, long tables with plates, the kitchen at the east end.
    box(sc, 15, -0.2, -41.6, 33, 0, -33, '#4a3424', { sub: 0.8, skip: ['bottom'] });
    box(sc, 14.7, 0, -41.9, 15, 3.4, -33, LOG, { sub: 0.8 }); box(sc, 33, 0, -41.9, 33.3, 3.4, -33, LOG, { sub: 0.8 });
    box(sc, 15, 0, -41.9, 33, 3.4, -41.6, LOG, { sub: 0.8, skip: ['front'] });
    quad(sc, V(15, 0, -41.6), V(29, 0, -41.6), V(29, 3.4, -41.6), V(15, 3.4, -41.6), LOG, { sub: 0.8 });
    quad(sc, V(31, 0, -41.6), V(33, 0, -41.6), V(33, 3.4, -41.6), V(31, 3.4, -41.6), LOG, { sub: 0.8 });
    quad(sc, V(29, 2.4, -41.6), V(31, 2.4, -41.6), V(31, 3.4, -41.6), V(29, 3.4, -41.6), LOG, { sub: 0.8 });
    quad(sc, V(15, 3.4, -33), V(33, 3.4, -33), V(33, 3.4, -41.6), V(15, 3.4, -41.6), '#3a2a1c', { double: true, sub: 0.8 });
    for (let x = 16; x < 33; x += 3) box(sc, x, 3.1, -41.6, x + 0.3, 3.4, -33, LOG_DARK);
    for (const z of [-35.5, -38.5]) {
      box(sc, 16, 0.75, z - 0.5, 26.5, 0.85, z + 0.5, '#6a4a30', { sub: 0.5 });
      for (let x = 16.6; x < 26; x += 1.2) {
        for (const dz of [-0.3, 0.3]) { box(sc, x - 0.18, 0.85, z + dz - 0.18, x + 0.18, 0.9, z + dz + 0.18, '#d8d4c8'); box(sc, x - 0.12, 0.9, z + dz - 0.12, x + 0.12, 0.92, z + dz + 0.12, '#7a4a2a'); }
      }
      box(sc, 16, 0, z - 1.1, 26.5, 0.45, z - 0.8, '#5a3e28'); box(sc, 16, 0, z + 0.8, 26.5, 0.45, z + 1.1, '#5a3e28');
    }
    box(sc, 19, 0, -34, 19.4, 0.5, -33.2, '#5a3e28'); // a chair knocked over
    // Kitchen: stove with steaming pots, counter, the boarded back door.
    box(sc, 28, 0, -41.5, 32.8, 0.95, -40.6, '#3a3a3a', { sub: 0.4 });
    for (const x of [28.6, 29.6]) { box(sc, x - 0.25, 0.95, -41.2, x + 0.25, 1.35, -40.8, '#55595f'); glow(sc, V(x, 1.7, -41), '#c8c8c8', 0.5, 0.18); }
    box(sc, 26.5, 0, -36.5, 27.2, 1, -33.5, '#5a4a3a', { sub: 0.4 }); // serving counter
    boards(sc, 29, 31, 0.2, 2.3, -41.55, 6);
    robed(sc, 30, 0, -42.6, 0, 0.3);
    light(sc, V(30, 1.6, -42.3), MOON, 1.2, 3);
    // Lamps hanging over the tables.
    for (const x of [18, 23, 28]) { box(sc, x - 0.2, 2.7, -37.2, x + 0.2, 2.9, -36.8, '#ffd08a', { emissive: 2.5 }); light(sc, V(x, 2.6, -37), LAMP, 1.3, 3.5); glow(sc, V(x, 2.75, -37), LAMP, 0.6, 0.6); }
    light(sc, V(29, 2.2, -40), '#ff9a50', 1, 2.5);
    const cam = camera(V(23.5, 1.6, -35.2), V(30, 1.2, -41.6), 640, W, H, 1);
    return render(sc, cam, gunModel() + vignette(W, H, 0.85)) + caption('Mess hall: the kitchen door', 'Stew still on the plates, pots still steaming. The kitchen back door is a barricade: they come in through the building.');
  },

  lake() {
    const sc = Scene({ ...S1, ambient: [0.03, 0.04, 0.065], exposure: 1.5, fog: { c: [0.03, 0.04, 0.06], start: 20, end: 70, max: 0.85 }, sky: (cam) => SKY(cam) + stars(200) + `<circle cx="980" cy="150" r="34" fill="#e4ecff"/><circle cx="980" cy="150" r="90" fill="#9fb4d8" fill-opacity=".12"/>` });
    camp(sc, { moon: 2.2, forestOpts: { n: 60 } });
    // Moon path on the water.
    for (let i = 0; i < 9; i++) box(sc, 64 + i * 3, -0.04, -11 - i * 1.1, 65.6 + i * 3, -0.03, -9.6 - i * 1.1, '#5a6a8a', { emissive: 0.9, sub: 2, skip: ['bottom', 'left', 'right', 'front', 'back'] });
    for (const [x, z, h] of [[58, -13, 0.25], [63, -21, 0.05], [55, -9, 0.6], [67, -15, -0.05], [52.5, -14.5, 0.9]]) wader(sc, x, z, h);
    robed(sc, 60.5, 0.3, -17.6, -Math.PI / 2, 0.25);
    const cam = camera(V(49.2, 1.9, -17.6), V(62, 0.5, -15), 720, W, H, 1);
    return render(sc, cam, vignette(W, H, 0.75)) + caption('The lake', 'From the jetty gate. Eyes above the water first, then they wade out and walk the jetty.');
  },

  tower() {
    const sc = Scene({ ...S1, ambient: [0.05, 0.055, 0.075], exposure: 1.4, fog: { c: [0.02, 0.025, 0.04], start: 30, end: 90, max: 0.75 }, sky: SKY });
    camp(sc, { power: true, onTop: true, forestOpts: { n: 160 } });
    for (const [x, z, f] of [[38, -28, 0.8], [40, -24.5, 0.8], [41.5, -27, 0.6], [44, -30, 1], [30, -20, 0.5], [27.5, -21.5, 0.4], [20, -12, 0.2], [36.5, -21, 0.7]]) robed(sc, x, 0, z, f, 0.25);
    player(sc, 25, 0, -18.5, 1, '#3a6ea5');
    const cam = camera(V(47.4, 7.8, -41.4), V(30, 0.5, -18), 700, W, H, 1);
    const ammo = `<g font-family="Oswald" font-weight="600" text-anchor="end" style="paint-order:stroke" stroke="#000" stroke-width="4"><text x="1240" y="660" font-size="44" fill="#f2eee6">4 <tspan font-size="26" fill="#ff5a3a">/ 0</tspan></text><text x="1240" y="690" font-family="Inter" font-size="14" fill="#ff5a3a" stroke-width="3">No ammo up here</text></g>`;
    return render(sc, cam, gunModel() + ammo + vignette(W, H, 0.7)) + caption('The watchtower', 'The whole camp below, but no ammo up here. Zombies broke the door at the bottom and are on the stairs.');
  },

  plan() {
    // Top-down plan: zones, fences and gates, barricades, buys.
    const PW = 1280, PH = 900, s = 16, ox = 230, oy = 790;
    const X = (x) => ox + x * s, Y = (z) => oy + z * s;
    const zones = [
      ['A', 'Fire circle', 'start', 14, -32, 34, 0, '#5a3a20'], ['B', 'Mess hall', '750', 14, -42, 36, -32, '#3a4a2a'], ['C', 'Chapel', '1000', 0, -42, 14, 0, '#2f3f58'],
      ['D', 'Cabins', '1000', 34, -32, 48, 0, '#3a3a52'], ['E', 'Compound', '1250', 36, -42, 48, -32, '#55402a'],
    ];
    let g = `<rect width="${PW}" height="${PH}" fill="#0d1014"/>`;
    // Forest and lake around the camp.
    g += `<rect x="${X(-12)}" y="${Y(-52)}" width="${60 * s}" height="${62 * s}" fill="#121a14"/>`;
    g += `<rect x="${X(50)}" y="${Y(-52)}" width="${18 * s}" height="${62 * s}" fill="#0c1826"/>`;
    g += `<rect x="${X(20)}" y="${Y(0)}" width="${8 * s}" height="${10 * s}" fill="#2a2620"/>`;
    for (const [k, name, cost, x0, z0, x1, z1, c] of zones) {
      g += `<rect x="${X(x0)}" y="${Y(z0)}" width="${(x1 - x0) * s}" height="${(z1 - z0) * s}" fill="${c}" fill-opacity=".55"/>`;
    }
    // Buildings.
    const bld = [[15, -41.6, 33, -33, 'Mess hall'], [3, -26, 11, -14, 'Chapel'], [5, -29, 9, -26, ''], [38, -8, 44, -4, 'Cabin 3'], [38, -16, 44, -12, 'Cabin 2'], [38, -24, 44, -20, 'Cabin 1'], [43, -31, 47.4, -27, 'Boathouse'], [37, -41, 41, -36, ''], [43, -34.5, 46, -32.6, ''], [44.4, -42, 48, -38.4, 'Stairs']];
    for (const [x0, z0, x1, z1, n] of bld) g += `<rect x="${X(x0)}" y="${Y(z0)}" width="${(x1 - x0) * s}" height="${(z1 - z0) * s}" fill="#2a2016" stroke="#c8a878" stroke-width="1.5"/>` + (n ? `<text x="${X((x0 + x1) / 2)}" y="${Y((z0 + z1) / 2) + 4}" font-family="Inter" font-size="11" font-weight="600" fill="#e9dcc4" text-anchor="middle">${n}</text>` : '');
    // Palisade with gaps.
    const pal = (x0, z0, x1, z1) => `<line x1="${X(x0)}" y1="${Y(z0)}" x2="${X(x1)}" y2="${Y(z1)}" stroke="#8a6a44" stroke-width="7"/>`;
    const sides = { s: [], n: [], w: [], e: [] };
    for (const [side, a, b] of Object.values(GAPS)) sides[side].push([a, b]);
    const run = (side, from, to, draw) => { let t = from; for (const [a, b] of [...sides[side]].sort((p, q) => p[0] - q[0])) { g += draw(t, a); t = b; } g += draw(t, to); };
    run('s', 0, 48, (a, b) => pal(a, 0, b, 0)); run('n', 0, 48, (a, b) => pal(a, -42, b, -42));
    run('w', -42, 0, (a, b) => pal(0, a, 0, b)); run('e', -42, 0, (a, b) => pal(48, a, 48, b));
    for (const [k, [side, a, b]] of Object.entries(GAPS)) {
      const [x0, z0, x1, z1] = side === 's' ? [a, 0, b, 0] : side === 'n' ? [a, -42, b, -42] : side === 'w' ? [0, a, 0, b] : [48, a, 48, b];
      g += `<line x1="${X(x0)}" y1="${Y(z0)}" x2="${X(x1)}" y2="${Y(z1)}" stroke="#ff5a3a" stroke-width="7" stroke-dasharray="4 3"/>`;
    }
    // Fences (dashed thin) and gates (gold).
    const fen = [[14, 0, 14, -15], [14, -18, 14, -42], [34, 0, 34, -15], [34, -18, 34, -32], [34, -32, 40, -32], [43, -32, 48, -32], [36, -32, 36, -35], [36, -38, 36, -42], [14, -32, 15, -32], [33, -32, 36, -32]];
    for (const [x0, z0, x1, z1] of fen) g += `<line x1="${X(x0)}" y1="${Y(z0)}" x2="${X(x1)}" y2="${Y(z1)}" stroke="#b89a70" stroke-width="2.5"/>`;
    const gates = [[14, -18, 14, -15, '1000'], [34, -18, 34, -15, '1000'], [23.2, -33, 25.8, -33, '750'], [40, -32, 43, -32, '1250'], [36, -38, 36, -35, '1250']];
    for (const [x0, z0, x1, z1, c] of gates) g += `<line x1="${X(x0)}" y1="${Y(z0)}" x2="${X(x1)}" y2="${Y(z1)}" stroke="#e8b84a" stroke-width="6"/><text x="${X((x0 + x1) / 2) + (x0 === x1 ? 8 : 0)}" y="${Y((z0 + z1) / 2) + (x0 === x1 ? 4 : 18)}" font-family="Oswald" font-size="13" fill="#e8b84a" text-anchor="${x0 === x1 ? 'start' : 'middle'}">${c}</text>`;
    // Fire, ring of benches, tents, totem.
    g += `<circle cx="${X(24)}" cy="${Y(-16)}" r="${9 * s}" fill="none" stroke="#ff7a2a" stroke-opacity=".35" stroke-dasharray="6 6"/>`;
    g += `<circle cx="${X(24)}" cy="${Y(-16)}" r="${6 * s}" fill="#ff7a2a" fill-opacity=".10"/>`;
    g += `<circle cx="${X(24)}" cy="${Y(-16)}" r="${4.2 * s}" fill="none" stroke="#8a6a44" stroke-width="5" stroke-dasharray="20 12"/>`;
    g += `<circle cx="${X(24)}" cy="${Y(-16)}" r="16" fill="#ff7a2a"/><circle cx="${X(24)}" cy="${Y(-16)}" r="7" fill="#ffd080"/>`;
    for (const a of [0.3, 1.0, 2.15, 2.85, 3.6, 5.8]) g += `<polygon points="${X(24 + Math.cos(a) * 9.5) - 14},${Y(-16 + Math.sin(a) * 9.5) + 12} ${X(24 + Math.cos(a) * 9.5) + 14},${Y(-16 + Math.sin(a) * 9.5) + 12} ${X(24 + Math.cos(a) * 9.5)},${Y(-16 + Math.sin(a) * 9.5) - 12}" fill="#6a6a4a"/>`;
    g += `<rect x="${X(23.6)}" y="${Y(-24.4)}" width="13" height="13" fill="#c8a040"/>`;
    // Jetty, minibus.
    g += `<rect x="${X(48.4)}" y="${Y(-18.6)}" width="${13.6 * s}" height="${2 * s}" fill="#5a4630"/>`;
    g += `<rect x="${X(22)}" y="${Y(8)}" width="${2.6 * s}" height="${2 * s}" fill="#c8c4b8"/><text x="${X(26)}" y="${Y(9)}" font-family="Inter" font-size="11" fill="#c8c4b8">minibus, headlights on</text>`;
    // Icons for buys, traps, perks, power, box.
    const icon = (x, z, col, txt, sub, anchor = 'start') => `<circle cx="${X(x)}" cy="${Y(z)}" r="7" fill="${col}" stroke="#000" stroke-width="1.5"/><text x="${X(x) + (anchor === 'start' ? 11 : -11)}" y="${Y(z) + 4}" font-family="Inter" font-size="12" font-weight="600" fill="#f2eee6" text-anchor="${anchor}" style="paint-order:stroke" stroke="#000" stroke-width="3">${txt}${sub ? ` <tspan fill="#e8b84a">${sub}</tspan>` : ''}</text>`;
    g += icon(24, -22, '#e8b84a', 'Longshot', '500');
    g += icon(28, -16, '#ff7a2a', 'Feed the fire', '1000');
    g += icon(20, -38.5, '#e8b84a', 'Ripper', '1000');
    g += icon(27, -36, '#b070ff', 'Box start', '');
    g += icon(7, -29.6, '#ff7a2a', 'Vespers bell', '750', 'start');
    g += icon(5, -18, '#4ac0ff', 'Tough Juice', '');
    g += icon(7, -15, '#d0b060', 'Altar', '(secret)');
    g += icon(39, -10, '#e8b84a', 'Barnburner', '1200');
    g += icon(37.6, -37, '#4ac0ff', 'Quick Hands', '', 'start');
    g += icon(44.5, -33.5, '#ffe060', 'Power', '', 'start');
    g += icon(37.6, -40, '#e8b84a', 'Crossbow', '1500', 'start');
    // Zone letters.
    for (const [k, name, cost, x0, z0, x1, z1] of zones) {
      const cx = k === 'A' ? 19 : k === 'C' ? 7 : k === 'D' ? 41 : (x0 + x1) / 2;
      const cz = k === 'A' ? -4 : k === 'C' ? -6 : k === 'D' ? -1.8 : k === 'B' ? -45.5 : -45.5;
      g += `<text x="${X(cx)}" y="${Y(cz)}" font-family="Oswald" font-size="20" font-weight="600" fill="#fff" text-anchor="middle" letter-spacing="1.5">${k} · ${name.toUpperCase()}</text><text x="${X(cx)}" y="${Y(cz) + 17}" font-family="Inter" font-size="12" fill="#e9e2d6" text-anchor="middle">${cost}</text>`;
    }
    // Zombie routes: arrows from the forest to each barricade.
    const arrow = (x0, z0, x1, z1) => `<line x1="${X(x0)}" y1="${Y(z0)}" x2="${X(x1)}" y2="${Y(z1)}" stroke="#ff5a3a" stroke-width="2" stroke-opacity=".8" marker-end="url(#ah)"/>`;
    g += `<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ff5a3a"/></marker></defs>`;
    g += arrow(24, 9.5, 24, 1) + arrow(31.5, 6, 31.5, 1) + arrow(6.5, 6, 6.5, 1) + arrow(-9, -18.5, -1, -18.5) + arrow(30, -50, 30, -43) + arrow(42.7, -50, 42.7, -43) + arrow(56, -40.3, 49, -40.3) + arrow(60, -17.6, 49, -17.6) + arrow(58, -4.5, 49, -4.5);
    // Legend and scale.
    const lg = [['#8a6a44', 'Palisade (3.2 m)'], ['#ff5a3a', 'Barricade'], ['#b89a70', 'Fence (1.2 m, shoot over)'], ['#e8b84a', 'Gate (door) and cost']];
    lg.forEach(([c, t], i) => (g += `<rect x="40" y="${60 + i * 26}" width="22" height="6" fill="${c}"/><text x="72" y="${67 + i * 26}" font-family="Inter" font-size="13" fill="#e9e2d6">${t}</text>`));
    g += `<text x="40" y="40" font-family="Oswald" font-size="26" font-weight="600" fill="#fff" letter-spacing="2">CAMP MORROW · TOP DOWN</text>`;
    g += `<line x1="40" y1="190" x2="${40 + 10 * s}" y2="190" stroke="#e9e2d6" stroke-width="2"/><text x="40" y="208" font-family="Inter" font-size="12" fill="#e9e2d6">10 m</text>`;
    g += `<text x="${X(55)}" y="${Y(-30)}" font-family="Oswald" font-size="18" fill="#6a8ab8" text-anchor="middle">LAKE</text><text x="${X(18)}" y="${Y(-48)}" font-family="Oswald" font-size="16" fill="#4a6a50">FOREST</text><text x="${X(24)}" y="${Y(10.5)}" font-family="Oswald" font-size="14" fill="#8a8070" text-anchor="middle">ROAD</text>`;
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${PW}" height="${PH}">${g}</svg>`;
  },
};

const id = location.hash.slice(1) || 'road';
const el = document.getElementById(id);
el.innerHTML = views[id]();
el.classList.add('on');
</script>
</body>
</html>
