<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zombiez P2P Test</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px 16px; background: #0d0f12; color: #e9e2d6; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p { color: #9a9488; margin: 0 0 16px; }
  .row { display: flex; gap: 8px; margin-bottom: 16px; }
  input { flex: 1; min-width: 0; padding: 10px; font: inherit; background: #16191e; color: inherit; border: 1px solid #333; border-radius: 6px; text-transform: uppercase; }
  button { padding: 10px 18px; font: inherit; font-weight: 600; background: #e8b84a; color: #111; border: 0; border-radius: 6px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0 0 16px; }
  dt { color: #9a9488; }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  .good { color: #5cff8a; } .bad { color: #ff6a5a; }
  pre { background: #16191e; padding: 10px; border-radius: 6px; font-size: 13px; white-space: pre-wrap; max-height: 240px; overflow: auto; }
</style>
</head>
<body>
<main>
  <h1>P2P test</h1>
  <p>Open this page on two devices on different networks (for example a laptop on Wi-Fi and a phone on mobile data). Enter the same code on both.</p>
  <div class="row"><input id="code" maxlength="8" placeholder="CODE"><button id="go">Join</button></div>
  <dl>
    <dt>Status</dt><dd id="status">Not joined</dd>
    <dt>Route</dt><dd id="route">–</dd>
    <dt>Fast channel (UDP-style)</dt><dd id="fast">–</dd>
    <dt>Reliable channel</dt><dd id="slow">–</dd>
  </dl>
  <pre id="log"></pre>
</main>
<script type="module" src="/src/p2p-test.ts"></script>
</body>
</html>
